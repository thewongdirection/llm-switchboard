<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Switchboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h16' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='11' r='3' fill='white'/%3E%3Ccircle cx='11' cy='16' r='3' fill='white'/%3E%3Ccircle cx='19' cy='21' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>LLM Switchboard</h1>
      <p>llama.cpp &rarr; Claude Code, locally</p>
    </div>
  </div>
  <div class="top-right">
    <div id="statusPill" class="pill stopped"><span class="dot"></span><span id="statusText">Server stopped</span></div>
    <button class="btn ghost" id="btnSettings">Settings</button>
  </div>
</header>

<div id="banner"></div>

<main class="layout">
  <section class="col-main">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="installed" role="tab">Installed models <span class="count" id="cntInstalled"></span></button>
      <button class="tab" data-tab="discover" role="tab">Discover <span class="count" id="cntNew"></span></button>
    </nav>
    <div id="paneInstalled" class="pane"></div>
    <div id="paneDiscover" class="pane" hidden></div>
  </section>

  <aside class="col-side">
    <div class="card" id="cardLaunch"></div>
    <div class="card" id="cardHardware"></div>
    <details class="card logs" id="cardLogs">
      <summary>Server log</summary>
      <pre id="logBox">No output yet.</pre>
    </details>
  </aside>
</main>

<dialog id="dlgSettings"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
